<!--
  Pip's sign-in email. Paste into Supabase → Authentication → Emails → Templates → "Magic Link"
  (the template signInWithOtp uses for existing users). Subject:

    Your Pip code: {{ .Token }}

  The code is the way in; an app installed to the Home Screen can't use the link, because the
  link opens the system browser. The link stays as a fallback for a desktop browser tab.
  Using either one uses up both. Supabase → Authentication → Providers → Email: OTP length 6.
-->
<div
  style="
    margin: 0;
    padding: 24px 16px;
    background: #ebddc5;
    font-family:
      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;
    color: #201e1d;
  "
>
  <div
    style="
      max-width: 480px;
      margin: 0 auto;
      background: #f5ead8;
      border-radius: 24px;
      padding: 28px 24px;
    "
  >
    <p style="margin: 0 0 6px; font-size: 15px; font-weight: 700">Your Pip sign-in code</p>
    <p style="margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: rgba(32, 30, 29, 0.8)">
      Type this into Pip:
    </p>
    <p
      style="
        margin: 0 0 20px;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: 0.18em;
        font-variant-numeric: tabular-nums;
      "
    >
      {{ .Token }}
    </p>
    <p style="margin: 0 0 24px; font-size: 13px; line-height: 1.5; color: rgba(32, 30, 29, 0.72)">
      It works once, for a short while. If you didn't ask for it, ignore this email — nobody can get
      in without the code.
    </p>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: rgba(32, 30, 29, 0.72)">
      On a computer? You can
      <a href="{{ .ConfirmationURL }}" style="color: #8c491a">sign in with this link</a> instead.
    </p>
  </div>
  <p
    style="
      max-width: 480px;
      margin: 14px auto 0;
      font-size: 11.5px;
      color: rgba(32, 30, 29, 0.72);
      text-align: center;
    "
  >
    Pip can look, never touch.
  </p>
</div>
