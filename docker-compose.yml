# Local Postgres for development only. Production uses a single DATABASE_URL
# pointing at Neon or Supabase — nothing here is host-specific, and nothing in
# the test suite or CI touches this container (CLAUDE.md hard line 7).
services:
  postgres:
    image: postgres:17-alpine
    container_name: pip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pip
      POSTGRES_PASSWORD: pip
      POSTGRES_DB: pip_dev
    ports:
      - "5432:5432"
    volumes:
      - pip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pip -d pip_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pip-postgres-data:
